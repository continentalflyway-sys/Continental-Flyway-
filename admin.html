<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continental Flyway — Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-body"><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><span>CONTINENTAL FLYWAY</span><small>ADMIN DASHBOARD</small></a><div class="admin-user"><span id="adminEmail"></span><button id="logoutBtn" class="nav-btn">Logout</button></div></div></header><main class="section"><div class="wrap"><div id="adminGate" class="loading">Checking admin access…</div><div id="dashboard" class="hidden"><div class="admin-head"><div><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1></div><button class="btn primary" id="newJobBtn">+ Add Vacancy</button></div><div id="stats" class="stats"></div><div class="tabs"><button class="tab active" data-tab="requests">Requests</button><button class="tab" data-tab="jobs">Job Vacancies</button><button class="tab" data-tab="messages">Contact Messages</button></div><section id="tab-requests"><div class="filters"><select id="requestTypeFilter"><option value="">All request types</option><option value="ticket">Ticket</option><option value="hotel">Hotel</option><option value="visa">Visa</option><option value="tour">Tour</option><option value="umrah">Umrah</option><option value="job">Job Interest</option></select><select id="statusFilter"><option value="">All statuses</option><option>Pending</option><option>Reviewed</option><option>Confirmed</option><option>Rejected</option></select></div><div id="requestsTable" class="table-wrap"></div></section><section id="tab-jobs" class="hidden"><div id="adminJobs" class="table-wrap"></div></section><section id="tab-messages" class="hidden"><div id="messagesTable" class="table-wrap"></div></section></div></div></main><div id="jobModal" class="modal hidden"><div class="modal-box"><button class="close" id="closeJob">×</button><span class="eyebrow">VACANCY</span><h2 id="jobModalTitle">Add Vacancy</h2><form id="jobForm" class="form"><input type="hidden" name="id"><input name="title" required placeholder="Job title"><input name="company_name" placeholder="Company name"><input name="country" required placeholder="Country"><input name="location" placeholder="Location"><input name="employment_type" placeholder="Employment type"><input name="salary" placeholder="Salary"><textarea name="description" placeholder="Description"></textarea><textarea name="requirements" placeholder="Requirements"></textarea><textarea name="benefits" placeholder="Benefits"></textarea><input name="deadline" type="date"><input name="image_url" placeholder="Image URL"><label class="check"><input name="is_active" type="checkbox" checked> Active vacancy</label><button class="btn primary">Save Vacancy</button><div class="form-msg" id="jobMsg"></div></form></div></div><script src="config.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
