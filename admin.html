<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONTINENTAL FLYWAY | Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10203b;font-family:Inter,sans-serif}.wrap{width:min(1100px,92%);margin:auto}.head{background:#071b3a;color:#fff;padding:18px 0}.head .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font:800 19px "Plus Jakarta Sans"}.brand small{display:block;font:600 10px Inter;color:#9fb3d1;letter-spacing:1px}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:20px;padding:25px;box-shadow:0 15px 40px #123b7010;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#f8fbff;border:1px solid #e4eaf3;border-radius:16px;padding:20px}.num{font:800 28px "Plus Jakarta Sans"}.muted{color:#65758c;font-size:13px}.input{width:100%;padding:12px;border:1px solid #dbe4f0;border-radius:10px;margin:5px 0;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#1261ff;color:#fff}.danger{background:#fee2e2;color:#991b1b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#edf3fb;border:0;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:#1261ff;color:#fff}.hidden{display:none}.row{padding:14px 0;border-bottom:1px solid #e7edf5}.login{max-width:430px;margin:80px auto}.notice{padding:12px;border-radius:10px;background:#fff7df;color:#805b00;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}.head .wrap{gap:10px;flex-wrap:wrap}}
</style></head><body>
<header class="head"><div class="wrap"><div class="brand">CONTINENTAL FLYWAY<small>ADMIN CONTROL CENTER</small></div><a href="index.html" style="color:#fff">← Website</a></div></header>
<main class="wrap">
<section id="login" class="panel login"><h2>Admin Login</h2><p class="muted">Sign in with a Supabase Auth account that is listed in the <code>admins</code> table.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">Dashboard</h2><p class="muted">Applications, inquiries and content management.</p></div><button class="btn danger" onclick="logout()">Sign out</button></div></div>
<div class="grid"><div class="card"><div class="num" id="apps">—</div><div class="muted">Applications</div></div><div class="card"><div class="num" id="inq">—</div><div class="muted">Inquiries</div></div><div class="card"><div class="num" id="jobs">—</div><div class="muted">Jobs</div></div></div>
<div class="panel"><div class="tabs"><button class="tab active" onclick="showTab('inquiries',this)">Inquiries</button><button class="tab" onclick="showTab('jobsTab',this)">Jobs</button><button class="tab" onclick="showTab('applications',this)">Applications</button></div>
<div id="inquiries"><div id="inqList" class="muted">Loading…</div></div>
<div id="jobsTab" class="hidden"><form onsubmit="addJob(event)"><div class="grid"><input class="input" name="title" required placeholder="Job title"><input class="input" name="country" required placeholder="Country"><input class="input" name="category" placeholder="Category"><input class="input" name="type" placeholder="Employment type"><input class="input" name="location" placeholder="Location"><input class="input" name="salary" placeholder="Salary (optional)"></div><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn primary">Add job</button></form><div id="jobList" style="margin-top:20px"></div></div>
<div id="applications" class="hidden"><div id="appList" class="muted">Loading…</div></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
let sb=null;
function ready(){return window.CF_CONFIG&&CF_CONFIG.SUPABASE_URL.startsWith('http')&&!CF_CONFIG.SUPABASE_URL.includes('YOUR-')}
async function login(){const m=document.querySelector('#loginMsg');if(!ready()){m.textContent='Please configure config.js with your Supabase URL and anon key first.';return}sb=supabase.createClient(CF_CONFIG.SUPABASE_URL,CF_CONFIG.SUPABASE_ANON_KEY);const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){m.textContent=error.message;return}await boot()}
async function boot(){if(!sb) sb=supabase.createClient(CF_CONFIG.SUPABASE_URL,CF_CONFIG.SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:admin}=await sb.from('admins').select('id').eq('id',user.id).maybeSingle();if(!admin){document.querySelector('#loginMsg').textContent='This account is not authorized as an admin.';await sb.auth.signOut();return}document.querySelector('#login').classList.add('hidden');document.querySelector('#dashboard').classList.remove('hidden');loadAll()}
async function loadAll(){const [a,i,j]=await Promise.all([sb.from('applications').select('id',{count:'exact',head:true}),sb.from('inquiries').select('id',{count:'exact',head:true}),sb.from('jobs').select('id',{count:'exact',head:true})]);apps.textContent=a.count??0;inq.textContent=i.count??0;jobs.textContent=j.count??0;const ir=await sb.from('inquiries').select('*').order('created_at',{ascending:false}).limit(30);inqList.innerHTML=(ir.data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.type||'Inquiry')}<br><span class="muted">${esc(x.phone||'')} · ${esc(x.email||'')}<br>${esc(x.message||'')}</span></div>`).join('')||'No inquiries yet.';const jr=await sb.from('jobs').select('*').order('created_at',{ascending:false});jobList.innerHTML=(jr.data||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b> — ${esc(x.country)} · ${esc(x.category||'')}<br><span class="muted">${esc(x.description||'')}</span></div>`).join('')||'No jobs yet.';const ar=await sb.from('applications').select('*').order('created_at',{ascending:false}).limit(30);appList.innerHTML=(ar.data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.job_title||'Application')}<br><span class="muted">${esc(x.phone||'')} · ${esc(x.email||'')}</span></div>`).join('')||'No applications yet.'}
async function addJob(e){e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('jobs').insert({title:f.get('title'),country:f.get('country'),category:f.get('category'),employment_type:f.get('type'),location:f.get('location'),salary:f.get('salary'),description:f.get('description')});if(error)alert(error.message);else{e.target.reset();loadAll()}}
function showTab(id,el){['inquiries','jobsTab','applications'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(ready()){sb=supabase.createClient(CF_CONFIG.SUPABASE_URL,CF_CONFIG.SUPABASE_ANON_KEY);boot()}
</script></body></html>
